<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <section class="menu_tab">
        <ul class="tabs">
            <li data-category="all">all</li>
            <li data-category="animal">animal</li>
            <li data-category="bird">bird</li>
            <li data-category="nature">nature</li>
        </ul>
    </section>

    <section class="menu_image">
        <div class="images" data-category="bird">
            <img
            src="https://images.pexels.com/photos/19822433/pexels-photo-19822433.jpeg"
            class="bird"
            alt=""
            />
        </div>
        <div class="images" data-category="bird">
            <img
            src="https://images.pexels.com/photos/38982994/pexels-photo-38982994.jpeg"
            class="bird"
            alt=""
            />
        </div>
        <div class="images" data-category="animal">
            <img
            src="https://images.pexels.com/photos/32474673/pexels-photo-32474673.jpeg"
            class="animal"
            alt=""
            />
        </div>
        <div class="images" data-category="nature">
            <img
            src="https://images.pexels.com/photos/32228687/pexels-photo-32228687.jpeg"
            class="nature"
            alt=""
            />
        </div>
        <div class="images" data-category="nature">
            <img
            src="https://images.pexels.com/photos/32730210/pexels-photo-32730210.jpeg"
            class="nature"
            alt=""
            />
        </div>
    </section>
    <script src="index.js" type="module"></script>
</body>
</html>
